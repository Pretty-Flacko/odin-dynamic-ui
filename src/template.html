<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dynamic UI</title>
	</head>
	<body>
		<div class="dropdown" data-dropdown>
			<button class="dropdown__toggle">Menu</button>
			<ul class="dropdown__menu">
				<li><button>Edit</button></li>
				<li><button>Copy</button></li>
				<li><button>Delete</button></li>
			</ul>
		</div>

		<div class="carousel" data-carousel>
			<div class="carousel__track">
				<img src="img/img1.jpg" alt="" class="carousel__slide" />
				<img src="img/img2.jpg" alt="" class="carousel__slide" />
				<img src="img/img3.jpg" alt="" class="carousel__slide" />
			</div>

			<button class="carousel__btn carousel__btn--prev">‹</button>
			<button class="carousel__btn carousel__btn--next">›</button>

			<div class="carousel__dots"></div>
		</div>
	</body>
</html>
